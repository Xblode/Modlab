<meta charset="utf-8">
<title>ModLab Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ============ Tokens — design system v2 « deux colonnes, flottants » ============ */
  :root{
    --c1:#1b1a19; --c2:#232221; --c3:#2a2928; --c4:#323130; --c5:#3c3a38;
    --sel:rgba(90,156,245,.14); --sel-line:rgba(90,156,245,.55);
    --line:rgba(255,255,255,.055); --line2:rgba(255,255,255,.10);
    --t1:#e8e6e2; --t2:#aaa59e; --t3:#7a766f; --t4:#4a4844;
    --accent:#5a9cf5;
    --green:#3fb950; --green-btn:#238636; --green-btn-h:#2ea043;
    --warn:#d29922; --danger:#f85149; --info:#5a9cf5;
    --win:#39d0d8; --lose:#f778ba; --gen:#a371f7; --claude:#d97757;
    --run:#6e3a27;
    --sh-float:0 4px 14px rgba(0,0,0,.22);
    --row:26px; --r:10px;
    --font-ui:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
    --font-mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --c1:#e9ebee; --c2:#ffffff; --c3:#f6f8fa; --c4:#eef0f3; --c5:#e2e5ea;
    --sel:rgba(9,105,218,.10); --sel-line:rgba(9,105,218,.55);
    --line:rgba(31,35,40,.08); --line2:rgba(31,35,40,.14);
    --t1:#1f2328; --t2:#59636e; --t3:#8c959f; --t4:#c1c8cf;
    --accent:#0969da; --green:#1a7f37; --green-btn:#1f883d; --green-btn-h:#1a7f37;
    --warn:#9a6700; --danger:#cf222e; --info:#0969da;
    --win:#0e8a9e; --lose:#bf3989; --gen:#8250df; --claude:#b5522f; --run:#f0c4ad;
    --sh-float:0 4px 14px rgba(31,35,40,.10);
    color-scheme:light;
  }
  :root[data-density="comfortable"]{ --row:34px; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--c2); color:var(--t1); font-family:var(--font-ui); font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden; }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
  input{ font:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px; }
  .mono{ font-family:var(--font-mono); font-size:12px; }
  .num{ font-variant-numeric:tabular-nums; }
  .muted{ color:var(--t3); }
  .kbd{ font-family:var(--font-mono); font-size:10.5px; color:var(--t3); border:1px solid var(--line2); border-radius:4px; padding:0 4px; line-height:15px; }
  .ico{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .ico.sm{ width:13px; height:13px; }
  .u{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--t3); font-weight:600; }
  .spacer{ flex:1; }
  /* Règle : un nom ne passe jamais sur deux lignes — il s'estompe sous ce qui est à sa droite */
  .fade{ display:block; overflow:hidden; white-space:nowrap; min-width:0; padding-right:14px; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent); }
  *{ scrollbar-width:thin; scrollbar-color:var(--t3) transparent; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--t3); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t2); }
  ::-webkit-scrollbar-button{ display:none; width:0; height:0; }
  ::-webkit-scrollbar-corner{ background:transparent; }

  /* ============ Deux colonnes ============ */
  .app{ display:grid; height:100vh; grid-template-columns:var(--sb,280px) minmax(0,1fr); grid-template-rows:minmax(0,1fr); grid-template-areas:"side main"; background:var(--c2); }
  .app.no-side{ --sb:0px; }
  @media (max-width:900px){ .app{ --sb:0px; } }
  .tb{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; color:var(--t2); position:relative; }
  .tb:hover{ background:var(--c3); color:var(--t1); }
  .tb[aria-pressed="true"]{ color:var(--t1); background:var(--c3); }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:6px; background:var(--c4); color:var(--t1); font-size:12px; white-space:nowrap; font-weight:500; }
  .btn:hover{ background:var(--c5); }
  .btn.primary{ background:var(--green-btn); color:#fff; } .btn.primary:hover{ background:var(--green-btn-h); }
  .btn.accent{ background:var(--accent); color:#fff; } .btn.accent:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:none; color:var(--t2); } .btn.ghost:hover{ color:var(--t1); background:var(--c3); }
  .btn.claude{ color:var(--claude); background:color-mix(in srgb,var(--claude) 12%,transparent); } .btn.claude:hover{ background:color-mix(in srgb,var(--claude) 20%,transparent); }
  .btn.sm{ height:22px; padding:0 8px; font-size:11.5px; }
  .btn:disabled{ opacity:.55; cursor:default; }
  .dot{ position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background:var(--warn); }

  /* ---- Panneau gauche ---- */
  .side{ grid-area:side; display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; background:var(--c1); border-right:1px solid var(--line2); }
  .no-side .side{ display:none; }
  .side-tools{ display:flex; align-items:center; gap:2px; height:36px; padding:0 8px; flex:none; }
  .side-tools .hact{ display:flex; gap:2px; }
  .side-instance{ flex:none; border-bottom:1px solid var(--line); }
  .side-instance:empty{ display:none; }
  .side-body{ flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; padding:0 6px 8px; }
  .side-foot{ flex:none; height:28px; border-top:1px solid var(--line); display:flex; align-items:center; gap:2px; padding:0 8px; font-size:11px; color:var(--t3); white-space:nowrap; overflow:hidden; }
  .side-foot .fi{ display:inline-flex; align-items:center; gap:4px; padding:0 5px; height:20px; border-radius:4px; }
  .side-foot .fi .ico{ width:12px; height:12px; }
  .side-foot .fi.fade{ padding-right:14px; min-width:0; }
  .app.running .side-foot{ background:var(--run); color:#fff; }
  .sec-h{ display:flex; align-items:center; gap:4px; height:26px; padding:0 3px 0 6px; width:100%; text-align:left; margin-top:6px; }
  .sec-h .ico{ width:12px; height:12px; color:var(--t3); transition:transform .12s; } .sec-h .sec-t{ display:flex; align-items:center; gap:4px; flex:1; min-width:0; height:100%; text-align:left; }
  .sec.closed .sec-h .sec-t .ico{ transform:rotate(-90deg); }
  .sec.closed .sec-b{ display:none; }
  .sec-h .cnt{ color:var(--t3); font-size:11px; font-variant-numeric:tabular-nums; } .sec-h .sec-act{ width:20px; height:20px; flex:none; color:var(--t3); } .sec-h .sec-act:hover{ background:var(--c3); color:var(--t1); } .sec-h .sec-act .ico{ width:13px; height:13px; }
  .tr{ display:flex; align-items:center; gap:6px; height:24px; padding:0 8px; margin:0 2px; border-radius:5px; color:var(--t2); width:calc(100% - 4px); text-align:left; white-space:nowrap; overflow:hidden; }
  .tr:hover{ background:var(--c3); color:var(--t1); }
  .tr.sel{ background:var(--c3); color:var(--t1); }
  .tr .ico{ width:14px; height:14px; color:var(--t3); }
  .tr .lbl{ overflow:hidden; white-space:nowrap; min-width:0; padding-right:14px; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent); }
  .tr .tail{ margin-left:auto; color:var(--t3); font-size:11px; font-variant-numeric:tabular-nums; display:flex; gap:6px; align-items:center; }
  .tr[data-d="2"]{ padding-left:26px; }
  .tr-row{ display:flex; align-items:center; gap:0; height:24px; margin:0 2px; border-radius:5px; color:var(--t2); }
  .tr-row:hover{ background:var(--c3); color:var(--t1); }
  .tr-row.sel{ background:var(--sel); color:var(--t1); }
  .tr-row.cur{ background:var(--c3); color:var(--t1); }
  .tr-row .tr-chev{ display:flex; align-items:center; justify-content:center; width:22px; height:24px; flex:none; color:var(--t3); border-radius:4px; }
  .tr-row .tr-chev:hover{ color:var(--t1); background:var(--c4); }
  .fav-star{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:24px; flex:none; color:var(--t3); border-radius:4px; opacity:0; }
  .tr-row:hover .fav-star, .inst-card:hover .fav-star{ opacity:1; }
  .fav-star.on{ opacity:1; color:var(--warn); }
  .fav-star:hover{ color:var(--t1); background:var(--c4); }
  .fav-star.on:hover{ color:var(--warn); }
  .fav-star .ico{ width:13px; height:13px; }
  .ico.fill{ fill:currentColor; }
  .tr-row .tr-label{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; height:24px; padding-right:4px; text-align:left; overflow:hidden; }
  .tr-row .tr-label .lbl{ overflow:hidden; white-space:nowrap; min-width:0; padding-right:14px; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent); }
  .tr-row .tr-label .tail{ margin-left:auto; color:var(--t3); font-size:11px; font-variant-numeric:tabular-nums; display:flex; gap:6px; align-items:center; }
  .tr-row.inst-row{ padding-left:20px; }
  .tr-rename-input{ flex:1; min-width:0; height:20px; background:var(--c2); border:1px solid var(--sel-line); border-radius:4px; color:var(--t1); font-size:12.5px; font-family:var(--font-ui); padding:0 5px; }
  .hd{ width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; flex:none; }
  .hd.warn{ background:var(--warn); } .hd.danger{ background:var(--danger); } .hd.idle{ background:var(--t3); }
  .chan{ display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 7px; border-radius:9px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .chan.stable{ color:var(--green); background:color-mix(in srgb,var(--green) 14%,transparent); }
  .chan.beta{ color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); }
  .chan.alpha{ color:var(--gen); background:color-mix(in srgb,var(--gen) 14%,transparent); }
  .chan.xs{ height:15px; padding:0 5px; font-size:9px; }

  /* Bloc loadout */
  .lo{ padding:8px 8px 6px; display:flex; flex-direction:column; gap:7px; }
  .lo-top{ display:flex; align-items:center; gap:8px; padding:0 2px; }
  .lo-name{ font-weight:600; font-size:14px; display:flex; align-items:center; flex:1; min-width:0; text-align:left; border-radius:4px; padding:1px 4px; margin:-1px -4px; }
  button.lo-name:hover{ background:var(--c3); color:var(--t1); }
  .lo-row{ display:flex; gap:6px; }
  .vsel{ flex:1; min-width:0; display:flex; align-items:center; gap:6px; height:28px; padding:0 8px; border-radius:6px; background:var(--c2); border:1px solid var(--line2); color:var(--t1); font-family:var(--font-mono); font-size:12px; }
  .vsel:hover{ border-color:var(--t3); }
  .vsel .ico{ width:12px; height:12px; color:var(--t3); }
  .vsel .d{ font-family:var(--font-ui); font-size:11px; color:var(--warn); font-weight:600; white-space:nowrap; }
  .vsel .d.ok{ color:var(--green); }
  .save-btn{ height:28px; position:relative; }
  .play-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:32px; border-radius:6px; background:var(--green-btn); color:#fff; font-weight:600; font-size:13px; position:relative; }
  .play-btn:hover{ background:var(--green-btn-h); }
  .play-btn .ico{ fill:currentColor; stroke:none; width:13px; height:13px; }
  .play-btn.stop{ background:var(--c4); color:var(--t1); }
  .play-btn .dot{ top:6px; right:8px; }
  .share-btn{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; height:26px; margin-top:6px; border-radius:6px; background:var(--c4); color:var(--t2); font-weight:500; font-size:11.5px; }
  .share-btn:hover{ background:var(--c5); color:var(--t1); }
  .share-btn .ico{ width:12px; height:12px; }
  .lo .st{ display:flex; gap:9px; color:var(--t3); font-size:11.5px; flex-wrap:wrap; font-variant-numeric:tabular-nums; padding:0 2px; }
  .lo .st b{ color:var(--t2); font-weight:500; }
  .caps{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px 5px; padding:6px 0 2px; }
  .cap{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; border-radius:6px; padding:6px 3px 5px; }
  .cap .ico{ width:15px; height:15px; color:var(--t4); }
  .cap .row{ display:flex; align-items:center; justify-content:center; gap:4px; max-width:100%; }
  .cap .lbl{ font-size:9.5px; color:var(--t3); line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cap .ver{ font-size:8.5px; color:var(--t4); line-height:1.1; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cap .dot{ width:6px; height:6px; border-radius:50%; background:var(--t4); flex:none; }
  .cap.on .ico{ color:#fff; } .cap.on .lbl{ color:var(--t2); } .cap.on .ver{ color:var(--t3); } .cap.on .dot{ background:var(--green); }

  /* Popovers */
  .pop{ position:fixed; background:var(--c3); border:1px solid var(--line2); border-radius:10px; box-shadow:var(--sh-float); padding:6px; z-index:45; display:none; min-width:220px; }
  .pop.open{ display:block; }
  .pop .it{ display:flex; align-items:center; gap:10px; min-height:30px; padding:4px 8px; border-radius:6px; font-size:12.5px; width:100%; text-align:left; color:var(--t1); }
  .pop .it:hover{ background:var(--c4); }
  .pop .it .ico{ width:14px; height:14px; color:var(--t3); }
  .pop .it .sub{ display:block; font-size:11px; color:var(--t3); }
  .pop .it.cur{ background:var(--sel); }
  .pop .sep{ height:1px; background:var(--line); margin:4px 2px; }
  .pop .it .mono{ color:var(--t1); }
  #capdlpop{ width:290px; padding:10px; }
  .cvhead{ display:flex; align-items:center; gap:9px; padding:2px 2px 8px; }
  .cvhead .ico{ width:18px; height:18px; color:var(--t2); flex:none; }
  .cvtitle{ font-weight:600; font-size:13px; }
  .cvsub{ color:var(--t3); font-size:11px; margin-top:1px; }
  .cvsec-h{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--t3); font-weight:600; padding:6px 2px 4px; }
  .cvlist{ display:flex; flex-direction:column; gap:2px; max-height:160px; overflow:auto; }
  .cvrow{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:6px 6px; border-radius:6px; font-size:12px; color:var(--t2); }
  .cvrow:hover{ background:var(--c4); color:var(--t1); }
  .cvrow .ico{ width:13px; height:13px; color:var(--t3); flex:none; }
  .cvrow.cur .ico{ color:var(--green); }
  .cvname{ flex:1; min-width:0; color:var(--t1); }
  .cvnote{ color:var(--t3); font-size:10.5px; white-space:nowrap; }
  .cvgo{ color:var(--t3); flex:none; }
  .cvgo .ico{ width:12px; height:12px; }
  .cvdrop{ display:flex; align-items:center; gap:10px; margin-top:8px; padding:10px; border-radius:8px; border:1px dashed var(--line2); color:var(--t3); }
  .cvdrop .ico{ width:18px; height:18px; flex:none; color:var(--t3); }
  .cvdrop b{ color:var(--t2); font-size:12px; font-weight:600; }
  .cvdrop.over{ border-color:var(--accent); background:var(--sel); color:var(--t1); }
  .cvdrop.over b{ color:var(--t1); }
  .cvfoot{ display:flex; gap:6px; margin-top:9px; }
  .cvfoot .btn{ flex:1; justify-content:center; }

  /* ---- Zone centrale ---- */
  .main{ grid-area:main; position:relative; min-width:0; min-height:0; background:var(--c2); }
  .sheet{ position:absolute; inset:0; background:var(--c2); display:flex; flex-direction:column; overflow:hidden; transition:right .2s cubic-bezier(.2,.8,.2,1); }
  @media (min-width:1280px){ .app:not(.no-right) .sheet{ right:356px; } }
  .tabs{ display:flex; align-items:stretch; height:36px; padding:4px 8px 0; gap:2px; flex:none; }
  .tabs-l{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; min-width:0; }
  .tabs-l::-webkit-scrollbar{ display:none; }
  .tabs-r{ margin-left:auto; display:flex; align-items:center; gap:2px; padding-bottom:2px; }
  .tab{ display:flex; align-items:center; gap:7px; padding:0 10px; border-radius:6px 6px 0 0; color:var(--t3); font-size:12.5px; white-space:nowrap; position:relative; }
  .tab:hover{ color:var(--t1); background:var(--c3); }
  .tab[aria-selected="true"]{ color:var(--t1); }
  .tab[aria-selected="true"]::after{ content:""; position:absolute; left:8px; right:8px; bottom:0; height:2px; border-radius:2px; background:var(--accent); }
  .tab .ico{ width:14px; height:14px; }
  .tab .x{ width:18px; height:18px; display:grid; place-items:center; border-radius:4px; color:var(--t3); opacity:0; margin-right:-4px; }
  .tab:hover .x, .tab[aria-selected="true"] .x{ opacity:1; }
  .tab .x:hover{ background:var(--c4); color:var(--t1); }
  .tab .cnt{ font-size:10.5px; padding:0 5px; border-radius:8px; background:var(--c4); color:var(--t2); font-variant-numeric:tabular-nums; }
  .tab .cnt.bad{ background:color-mix(in srgb,var(--danger) 22%,transparent); color:var(--danger); }
  .tab .cnt.warn{ background:color-mix(in srgb,var(--warn) 22%,transparent); color:var(--warn); }
  .ti{ display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 6px; border-radius:6px; white-space:nowrap; color:var(--t3); font-size:11.5px; }
  .ti:hover{ background:var(--c3); color:var(--t1); }
  .ti[aria-pressed="true"]{ background:var(--c3); color:var(--t1); }
  .ti .ico{ width:13px; height:13px; }
  .ti.claude{ color:var(--claude); }
  .ti .n{ font-variant-numeric:tabular-nums; }
  .ti .bad-n{ color:var(--danger); display:inline-flex; } .ti .warn-n{ color:var(--warn); display:inline-flex; }
  .tbar{ display:flex; align-items:center; gap:6px; height:34px; padding:0 12px 0 14px; border-bottom:1px solid var(--line); flex:none; }
  .crumbs{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--t3); white-space:nowrap; }
  .crumbs .ico{ width:12px; height:12px; }
  .crumbs b{ color:var(--t2); font-weight:500; }
  .chipf{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 8px; border-radius:6px; color:var(--t2); font-size:12px; background:var(--c3); }
  .chipf:hover{ background:var(--c4); color:var(--t1); }
  .chipf[aria-pressed="true"]{ background:var(--sel); color:var(--t1); box-shadow:inset 0 0 0 1px var(--sel-line); }
  .chipf .ico{ width:13px; height:13px; }
  .content{ flex:1; min-height:0; overflow:auto; position:relative; }
  .split-wrap{ display:flex; flex:1; min-height:0; }
  .split-pane{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .split-pane + .split-pane{ border-left:1px solid var(--line2); }
  .split-head{ display:flex; align-items:center; gap:6px; height:26px; padding:0 6px 0 12px; font-size:11.5px; color:var(--t3); flex:none; border-bottom:1px solid var(--line); }
  .split-head .ico{ width:13px; height:13px; }

  /* grille des mods */
  .grid{ display:grid; grid-template-columns:20px 28px 44px minmax(210px,36%) 200px 92px 118px minmax(80px,1fr); min-width:820px; }
  .gh{ display:contents; }
  .gh > div{ position:sticky; top:0; z-index:2; background:var(--c2); border-bottom:1px solid var(--line2); padding:0 8px; height:26px; display:flex; align-items:center; font-size:11px; color:var(--t3); font-weight:600; }
  .row{ display:contents; }
  .row > div{ height:var(--row); display:flex; align-items:center; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-bottom:1px solid var(--line); }
  .row:hover > div{ background:var(--c3); }
  .row.sel > div{ background:var(--sel); }
  .row.sel > div:first-child{ box-shadow:inset 2px 0 0 var(--sel-line); }
  .row.off > div{ color:var(--t3); }
  .row .grip{ color:var(--t3); opacity:0; cursor:grab; padding:0 2px; }

  function whyText(m){
    if(m.bad) return `Désactivé automatiquement : <b>${m.bad}</b>. ${m.bad.includes('master')?'Son master <span class="mono">Lux.esp</span> est chargé après lui — corriger l’ordre (LOOT) ou déplacer le patch réactive le plugin.':'La version du jeu / du loader ne correspond pas.'} <b>Réversible.</b>`;
    if(m.gen) return `Fichiers <b>générés</b> par un outil puis capturés depuis <span class="mono">overwrite/</span>. Un changement d’animation, de corps ou de LOD demande une régénération.`;
    if(m.root) return `Ce mod pose des fichiers <b>à la racine du jeu</b> (hors <span class="mono">Data/</span>) : ils sont déployés par le backend « racine », tracés fichier par fichier, et retirés proprement à la désactivation.`;
    if(m.win&&m.lose) return `Ce mod <b>gagne</b> sur ${m.win} fichier(s) et <b>perd</b> sur ${m.lose} : question de priorité, pas d’erreur.`;
    if(m.win) return `Il écrase ${m.win} fichier(s) de mods plus haut dans la liste. Aucune règle ne s’y oppose.`;
    if(m.lose) return `${m.lose} de ses fichiers sont remplacés par un mod plus bas dans la liste. Si un visuel te semble faux, c’est le premier endroit où regarder.`;
    return `Activé, aucun conflit de fichier, ${m.plugins.length?'plugins présents dans l’ordre de chargement':'aucun plugin'}. Rien à signaler.`;
  }

  function renderSheet(){

      const id=t.dataset.tab;
      if(e.shiftKey){ const base=S.split?S.split[0]:S.tab; if(id!==base){ S.split=[base,id]; S.tab=base; renderSheet(); toast('Vue divisée : '+tabMeta(base).l+' + '+tabMeta(id).l+' — clic simple pour revenir'); } return; }
      S.split=null; S.tab=id; renderSheet();
    }));
    el.querySelectorAll('[data-split-close]').forEach(b=>b.addEventListener('click',()=>{ const keep=S.split.find(id=>id!==b.dataset.splitClose); S.split=null; if(keep) S.tab=keep; renderSheet(); }));

  function syncHeroArt(){
    const art=$('.ghero .art.has-img'); const ginfo=$('.ghero .ginfo'); if(!art||!ginfo) return;
    const h=ginfo.getBoundingClientRect().height; if(!h) return;
    const w=Math.max(140,Math.min(340,h*460/215));
    art.style.height=h+'px'; art.style.width=w+'px';
  }
  window.addEventListener('resize',()=>{ clearTimeout(window._hrt); window._hrt=setTimeout(syncHeroArt,80); });
  function rowTool(id,t){ const m=modById(id); if(t==='cfg') openTab('cfg:'+m.id,m.name+' · réglages','sliders'); else if(t==='claude'){ S.sel=id; S.rtab='claude'; setRight(true); renderRight(); } else toast('Maquette : « '+{folder:'Ouvrir le dossier',web:m.src,more:'Plus…'}[t]+' » pour '+m.name); }
  function toggleMod(id){ const m=modById(id); m.on=!m.on; renderSheet(); renderRight(); renderSide(); toast(`${m.on?'Activation':'Désactivation'} de « ${m.name} » — à enregistrer (r.${LO().rev+1})`); }

  /* ---------- Panneau droit ---------- */
  function setRight(open){ app.classList.toggle('no-right',!open); }
  function renderRight(){
    const el=$('#right'); const m=modById(S.sel);
    const rsec=(id,t,b,c)=>`<div class="sec rsec ${S.secs['r-'+id]===false?'closed':''}" data-sec="r-${id}"><div class="sec-h"><button class="sec-t">${ic('chev')}<span class="u">${t}</span>${c!=null?`<span class="cnt">(${c})</span>`:''}</button></div><div class="sec-b">${b}</div></div>`;
    const head = `<div class="rhead" role="tablist"><button class="tab" data-rtab="insp" aria-selected="${S.rtab==='insp'}">${ic('info','sm')}Inspecteur</button><button class="tab" data-rtab="claude" aria-selected="${S.rtab==='claude'}"><span style="color:var(--claude)">${ic('sparkle','sm')}</span>Claude <span class="cnt">1</span></button><span class="spacer"></span><button class="tb" id="r-close" title="Fermer (Ctrl+L)">${ic('x','sm')}</button></div>`;
    let body='';
    if(S.rtab==='insp'){
      body = !m ? `<div class="empty" style="height:auto;padding:30px"><div>${ic('info')}<h3>Aucune sélection</h3><p>Clique sur un mod pour voir son statut et le « pourquoi ».</p></div></div>` :
        `<div class="rtitle"><div class="eyebrow">Mod · sélection</div><h2>${m.name}</h2><div class="line"><span class="mono">${m.ver}</span><span>${m.cat}</span>${badgeConflict(m)}<button class="btn ghost sm" id="r-open" style="margin-left:auto">Ouvrir ${ic('chevr','sm')}</button></div></div>
        ${rsec('ap','Aperçu',`<dl class="kv"><dt>Statut</dt><dd>${m.on?'Activé':'Désactivé'}${m.on!==m.base?' · <span style="color:var(--warn)">non enregistré</span>':''}</dd><dt>Source</dt><dd>${m.src}${m.nexus?' #'+m.nexus:''}</dd><dt>Fichiers</dt><dd class="num">${m.files.toLocaleString('fr-FR')}${m.root?' · racine':''}</dd><dt>Plugins</dt><dd>${m.plugins.length?m.plugins.map(p=>`<span class="mono">${p}</span>`).join(', '):'aucun'}</dd>${m.cfg?`<dt>Réglages</dt><dd><button class="btn ghost sm" data-cfg="${m.id}" style="margin-left:-8px">${ic('sliders','sm')}${m.cfg}</button></dd>`:''}</dl>`)}
        ${rsec('why','Pourquoi ce statut',`<div class="callout">${whyText(m)}</div>`)}
        ${rsec('cf','Conflits',`<div style="font-size:12px">${m.win?`<div style="display:flex;gap:8px;padding:3px 0"><span class="badge win">${ic('flag')}${m.win}</span><span>gagne sur des mods plus haut</span></div>`:''}${m.lose?`<div style="display:flex;gap:8px;padding:3px 0"><span class="badge lose">${ic('flag')}${m.lose}</span><span>perd face à des mods plus bas</span></div>`:''}${!m.win&&!m.lose?'<span class="muted">Aucun conflit de fichier.</span>':''}</div>`, m.win+m.lose)}
        ${rsec('hs','Historique',`<ul class="hist"><li><span class="dot2 you"></span><div>r.141 · priorité modifiée<div class="when">hier 22:04 · toi</div></div></li><li><span class="dot2 claude"></span><div>r.127 · note KB ajoutée<div class="when">04/09 · Claude, approuvé par toi</div></div></li><li><span class="dot2"></span><div>r.98 · installé<div class="when">21/08 · toi</div></div></li></ul>`)}`;
    } else {
      body = `<div class="chat"><div class="callout" style="margin:8px 12px 0;font-size:11px;display:flex;align-items:center;gap:6px">${ic('gear','sm')}Diagnostic local · <b>${llmModelName(S.llmModel)}</b><span class="muted">— pré-mâché par des règles, le modèle ne fait que rédiger</span></div><div class="msgs"><div class="msg me">Pourquoi le patch Lux ↔ JK’s est désactivé ?</div>
        <div class="msg ai"><div class="who">${ic('sparkle','sm')}Claude · via MCP</div>Parce que son master <span class="mono">Lux.esp</span> est chargé <b>après</b> lui depuis ton réordonnancement d’hier (r.141). Je propose de remettre le patch sous Lux.esp — l’ordre que LOOT recommande — et de le réactiver. Aucun fichier n’est écrit, seulement <span class="mono">plugins.txt</span>.
          <div class="plan-card"><div class="ph">${ic('layers','sm')}Réactiver le patch Lux ↔ JK’s<span class="mono">plan #128</span></div><pre><span style="color:var(--win)">~</span> déplacer JKs Skyrim - Lux Patch.esp  14 → 15 (après Lux.esp)
<span style="color:var(--green)">+</span> activer  JKs Skyrim - Lux Patch.esp
  révision r.${LO()?LO().rev+1:'?'} créée · réversible · 0 fichier touché</pre><div class="pf"><button class="btn sm">Voir le diff</button><button class="btn sm claude">${ic('check','sm')}Approuver</button><button class="btn sm ghost">Refuser</button></div></div></div></div>
        <div class="in"><input placeholder="Demander à Claude… (@mod, @plugin, @branche pour cibler)"><div class="row2"><span>Contexte : ${LO()?LO().n:'—'} · r.${LO()?LO().rev:'—'}${m?' · '+m.name:''}</span><span class="spacer"></span><span class="kbd">↵</span>${ic('send','sm')}</div></div></div>`;
    }
    el.innerHTML = head + `<div class="rbody">${body}</div>`;
    el.querySelectorAll('.rhead .tab').forEach(t=>t.addEventListener('click',()=>{S.rtab=t.dataset.rtab; renderRight();}));
    el.querySelectorAll('.sec-h').forEach(h=>h.addEventListener('click',()=>{const s=h.parentElement; S.secs[s.dataset.sec]=s.classList.contains('closed'); s.classList.toggle('closed');}));
    $('#r-close').addEventListener('click',()=>setRight(false));
    const ro=$('#r-open'); if(ro) ro.addEventListener('click',()=>openTab('mod:'+m.id,m.name,'box'));
    el.querySelectorAll('[data-cfg]').forEach(b=>b.addEventListener('click',()=>{ const mm=modById(+b.dataset.cfg); openTab('cfg:'+mm.id,mm.name+' · réglages','sliders'); }));
    el.querySelectorAll('.btn:not(#r-open):not([data-cfg])').forEach(b=>b.addEventListener('click',()=>toast('Maquette : « '+b.textContent.trim()+' »')));
  }

  /* ---------- Panneau du bas ---------- */
  function openTP(tab){ if(S.tp && S.ptab===tab){ S.tp=false; } else { S.ptab=tab; S.tp=true; } renderTP(); renderSheet(); }
  function renderTP(){
    const tp=$('#tpanel'); tp.classList.toggle('open',S.tp); $('#composer-panel').setAttribute('aria-pressed',String(S.tp));
    const tabs=[['console','Console',null,''],['tx','Transactions',1,''],['problems','Problèmes',3,'bad'],['jobs','Téléchargement',2,'']];
    $('#tp-bar').innerHTML = tabs.map(([id,l,c,k])=>`<button class="tab" data-ptab="${id}" aria-selected="${S.ptab===id}">${l}${c!=null?`<span class="cnt ${k}">${c}</span>`:''}</button>`).join('') + `<span class="spacer"></span><button class="tb" id="tp-close" title="Fermer (Ctrl+J)">${ic('x','sm')}</button>`;
    const b=$('#tp-body');
    if(S.ptab==='tx'){
      b.innerHTML = `<div class="tx"><div class="t">${ic('box','sm')}Installer JK’s Skyrim 1.7 <span class="mono muted">plan #127</span></div><div class="acts"><button class="btn sm">Voir le plan</button><button class="btn sm primary">${ic('check','sm')}Appliquer</button></div><div class="d">1 842 fichiers · 3 conflits (Lux) · 1 plugin remplacé · révision créée avant · <b style="color:var(--green)">réversible</b></div><pre><span class="add">+ 1 839</span> fichiers nouveaux dans le store (dédup : 412 déjà présents)
<span class="cf">±     3</span> fichiers en conflit avec Lux → Lux garde la main (priorité)
<span class="wn">~     1</span> plugin remplacé : JKs Skyrim.esp 1.6b → 1.7 (masters inchangés)
  choix FOMOD réappliqués depuis r.98 · vérification des hashes après copie</pre></div>
        <div class="tx claude"><div class="t"><span style="color:var(--claude)">${ic('sparkle','sm')}</span><span class="who">Claude propose</span>Réactiver le patch Lux ↔ JK’s Skyrim <span class="mono muted">plan #128</span></div><div class="acts"><button class="btn sm">Voir le plan</button><button class="btn sm claude">Approuver</button></div><div class="d">Déplace le patch sous Lux.esp (ordre LOOT) et le réactive. Aucune écriture de fichier, uniquement plugins.txt.</div></div>`;
    } else if(S.ptab==='problems'){
      b.innerHTML = `<div class="prob">${diags.map(d=>`<div><span style="color:var(--${d.sev})">${ic(d.ico,'sm')}</span><span>${d.t} <span class="mono">${d.where}</span></span><span class="muted" style="font-size:11px">${d.sev==='danger'?'bloquant':d.sev==='warn'?'avertissement':d.sev==='info'?'info':'ok'}</span></div>`).join('')}</div>`;
    } else if(S.ptab==='jobs'){
      b.innerHTML = `<div class="job"><div><b>Téléchargement</b> · JK’s Skyrim 1.7 <span class="muted mono">jks_skyrim-6289-1-7.7z</span></div><div class="num muted">318 / 412 Mo · 41 Mo/s</div><div class="bar"><i style="--p:77%"></i></div></div><div class="job"><div><b>Indexation</b> · hashes du store (incrémental)</div><div class="num muted">12 480 / 12 480 · terminé</div><div class="bar"><i style="--p:100%;background:var(--green)"></i></div></div>`;
    } else {
      b.innerHTML = `<div class="console"><span class="ts">22:31:02</span> <span class="lv">INFO</span> tx#127 plan construit en 412 ms · 1 842 fichiers · 3 conflits
<span class="ts">22:31:02</span> <span class="lv">INFO</span> store: 412 blobs déjà présents (dédup 22 %)
<span class="ts">22:31:04</span> <span class="lv w">WARN</span> branche r.142: JKs Skyrim - Lux Patch.esp désactivé (master manquant) — D-014
<span class="ts">22:31:05</span> <span class="lv">INFO</span> caps: SKSE 2.2.6 · ENB Rudy · DLSS FG (PDPerfPlugin.dll) — RTX 4070 ok
<span class="ts">22:31:05</span> <span class="lv">INFO</span> mcp: claude → modlab_plan(reorder plugins) → plan#128 en attente d’approbation</div>`;
    }
    $('#tp-bar').querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{S.ptab=t.dataset.ptab; renderTP(); renderSheet();}));
    $('#tp-close').addEventListener('click',()=>{S.tp=false; renderTP(); renderSheet();});
    b.querySelectorAll('.btn').forEach(x=>x.addEventListener('click',()=>toast('Maquette : « '+x.textContent.trim()+' »')));
  }

  /* ---------- Dock : bandeau d'activité, palette ancrée, suggestions ---------- */
  function renderBand(){
    /* Un seul chip de statut à la fois : session en cours > téléchargement actif > plan en attente */
    let chip;
    if(S.running) chip = `<span class="achip run"><span class="pulse"></span><span class="txt">Skyrim en cours · 00:12 · 71 fps</span><button class="btn sm" id="band-stop">Arrêter</button></span>`;
    else if(S.dlActive) chip = `<button class="achip" data-open="jobs" title="Téléchargement en cours">${ic('dl')}<span class="txt">JK’s 1.7 · 77 %</span><span class="bar" style="--p:77%"></span></button>`;
    else chip = `<button class="achip" data-open="tx" title="Plan en attente d’approbation"><span class="pulse"></span><span class="txt">Installer JK’s Skyrim 1.7<span class="muted">· 3 conflits</span></span><span class="btn sm" data-a="voir">Voir</span><span class="btn sm primary" data-a="appliquer">Appliquer</span></button>`;
    const claudeBtn = S.diagQueued
      ? `<button class="cb-claude queued" id="cb-claude" title="Le jeu est en cours — le diagnostic local se lancera automatiquement à la fin de la partie">${ic('history','sm')}En attente de fin de partie</button>`
      : `<button class="cb-claude" id="cb-claude">${ic('sparkle','sm')}Diagnostique le dernier crash</button>`;
    const tb=$('#composer-toolbar');
    tb.innerHTML = `<button class="cb-add" id="cb-add" title="Créer une recette">+</button><button class="cb-select" id="cb-select" data-pop title="Recettes">${ic('wand','sm')}<span>Recettes</span>${ic('chev','sm')}</button><span class="spacer"></span>${chip}${claudeBtn}`;
    tb.querySelectorAll('.achip[data-open]').forEach(b=>b.addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(a){ toast('Maquette : « '+a.textContent+' » (plan #127)'); return; } openTP(b.dataset.open); }));
    const st=$('#band-stop'); if(st) st.addEventListener('click',play);
    $('#cb-add').addEventListener('click',()=>toast('Maquette : créer une nouvelle recette'));
    $('#cb-select').addEventListener('click',e=>{ e.stopPropagation(); openPop('recpop', e.currentTarget, recipes.map(([t,i])=>({l:t,i,fn:()=>toast('Maquette : recette « '+t+' »')})), {above:true}); });
    $('#cb-claude').addEventListener('click',()=>{
      if(S.running){
        if(S.diagQueued){ toast('Déjà en attente — sera lancé automatiquement à la fin de la partie'); return; }
        S.diagQueued = true; renderBand();
        toast('Diagnostic local mis en attente — le jeu tourne, il se lancera automatiquement à la fin de la partie');
        return;
      }
      S.rtab='claude'; setRight(true); renderRight();
    });
  }
  let cpCur=0;
  function renderCP(){
    const q=$('#cp-in').value.trim().toLowerCase();
    const list=commands.filter(c=>!q||c.l.toLowerCase().includes(q)||c.g.toLowerCase().includes(q));
    const hits=q?MODS().filter(m=>!m.sep&&m.name.toLowerCase().includes(q)).map(m=>({g:'Mod',l:m.name,i:'box',mod:m.id})):[];
    const all=[...hits,...list]; cpCur=Math.min(cpCur,Math.max(0,all.length-1));
    $('#cp-list').innerHTML = all.map((c,i)=>`<button class="it ${i===cpCur?'cur':''}" data-i="${i}"><span class="${c.c?'claude':''}">${ic(c.i)}</span><span>${c.l}<span class="grp">${c.g}</span></span>${c.k?`<span class="kbd">${c.k}</span>`:''}</button>`).join('') || `<div class="muted" style="padding:10px">Aucun résultat</div>`;
    $('#cp-list').querySelectorAll('.it').forEach(b=>{ b.addEventListener('mousedown',e=>e.preventDefault()); b.addEventListener('click',()=>runCP(all[+b.dataset.i])); });
    $('#cp-list')._all=all;
  }
  function runCP(c){ closeCP(); if(!c) return; if(c.mod){ S.sel=c.mod; openTab('mod:'+c.mod,c.l,'box'); setRight(true); renderRight(); return; } if(c.l.startsWith('Jouer')){ play(); return; } if(c.l==='Panneau gauche'){ toggleSide(); return; } if(c.l==='Panneau du bas'){ S.tp=!S.tp; renderTP(); renderSheet(); return; } if(c.l==='Panneau droit'){ setRight(app.classList.contains('no-right')); return; } if(c.l.startsWith('Accueil')){ openTab('home','Accueil','home'); return; } if(c.l.startsWith('Enregistrer')){ const sb=$('#save-btn'); if(sb&&!sb.disabled) sb.click(); else toast('Rien à enregistrer'); return; } if(c.c){ S.rtab='claude'; setRight(true); renderRight(); toast('Claude : « '+c.l.replace('› ','')+' » — plan en préparation (maquette)'); return; } toast('Maquette : « '+c.l+' »'); }
  function openCP(){ $('#cp').classList.add('open'); $('#composer-wrap').classList.add('cp-open'); $('#composer-box').classList.add('focus'); cpCur=0; renderCP(); }
  function closeCP(){ $('#cp').classList.remove('open'); $('#composer-wrap').classList.remove('cp-open'); $('#composer-box').classList.remove('focus'); $('#cp-in').blur(); }
  $('#cp-in').addEventListener('focus',openCP);
  $('#cp-in').addEventListener('input',()=>{cpCur=0;renderCP();});
  $('#cp-in').addEventListener('keydown',e=>{ const all=$('#cp-list')._all||[]; if(e.key==='ArrowDown'){e.preventDefault();cpCur=Math.min(all.length-1,cpCur+1);renderCP();} if(e.key==='ArrowUp'){e.preventDefault();cpCur=Math.max(0,cpCur-1);renderCP();} if(e.key==='Enter'){runCP(all[cpCur]);} if(e.key==='Escape'){closeCP();} });
  document.addEventListener('mousedown',e=>{ if($('#cp').classList.contains('open') && !e.target.closest('#composer-wrap')) closeCP(); });
  $('#composer').addEventListener('click',e=>{ if(!e.target.closest('#composer-panel')) $('#cp-in').focus(); });
  $('#composer-panel').addEventListener('click',e=>{ e.stopPropagation(); openTP('console'); });
  const scrollMemo=new WeakMap();
  document.addEventListener('scroll',e=>{ const el=e.target; if(!(el instanceof Element)||!el.classList.contains('content')) return; const wrap=$('#composer-wrap'); const top=el.scrollTop, prev=scrollMemo.get(el)??0; if(top>prev+4&&top>24) wrap.classList.add('hidden'); else if(top<prev-4||top<=4) wrap.classList.remove('hidden'); scrollMemo.set(el,top); },true);

  /* ---------- Tokens, jeu, raccourcis ---------- */
  function renderTokens(){
    const cs=getComputedStyle(document.documentElement); const v=n=>cs.getPropertyValue(n).trim();
    const sem=[['accent','--accent','sélection, focus'],['green / green-btn','--green','OK · Jouer'],['warn','--warn','à enregistrer, MAJ'],['danger','--danger','bloquant'],['conflict.win','--win','écrase'],['conflict.lose','--lose','écrasé'],['generated','--gen','généré par outil · canal alpha'],['claude','--claude','tout ce qui vient de Claude'],['run','--run','jeu en cours']];
    $('#tokens').innerHTML = `<h3>Fonds — ${document.documentElement.dataset.theme==='light'?'thème clair':'thème sombre'}</h3><div class="lad"><i style="background:var(--c1)">c1 gauche</i><i style="background:var(--c2)">c2 centre</i><i style="background:var(--c3)">c3 flottant</i><i style="background:var(--c4)">c4 survol</i><i style="background:var(--c5)">c5 pressé</i></div><div class="muted" style="font-size:11.5px;margin:-4px 0 10px">Deux colonnes : gauche (c1, bordure 1 px) et centre (c2, la couleur générale). Les flottants (c3) ont un rayon 10 px, une bordure 1 px et une ombre légère.</div>
      <h3>Texte</h3>${[['t1','--t1'],['t2','--t2'],['t3','--t3']].map(([n,c])=>`<div class="sw"><i style="background:var(${c})"></i><span>${n}</span><span class="v">${v(c)}</span></div>`).join('')}
      <h3 style="margin-top:10px">Sémantique</h3>${sem.map(([n,c,u])=>`<div class="sw"><i style="background:var(${c})"></i><span>${n} <span class="muted">· ${u}</span></span><span class="v">${v(c)}</span></div>`).join('')}
      <h3 style="margin-top:10px">Source de vérité</h3><div class="muted" style="font-size:11.5px;margin:-4px 0 10px">Le shell réel (<code>ui/src/shell.css</code>) reflète désormais ces tokens en variables CSS — cette maquette reste la référence visuelle et le terrain d'essai des évolutions (voir cadrage §6.5 et §6.6).</div>
      <h3 style="margin-top:10px">Rythme</h3><div class="muted" style="font-size:11.5px">UI : police système 13 px / 12 px listes · données : Cascadia Code / JetBrains Mono 12 px · lignes ${v('--row')} · rayon 10 px (flottants), 6 px (contrôles) · barres 36 / 34 / 28 px · mouvement 120–200 ms</div><div style="margin-top:8px"><button class="btn sm" id="tokens-close">Fermer</button></div>`;
    $('#tokens-close').addEventListener('click',()=>$('#tokens').classList.remove('open'));
  }
  function play(){
    S.running=!S.running; app.classList.toggle('running',S.running); renderSide();
    if(!S.running && S.diagQueued){
      S.diagQueued=false; renderBand();
      toast('Session terminée · diagnostic local lancé automatiquement ('+llmModelName(S.llmModel)+')');
      S.rtab='claude'; setRight(true); renderRight();
    } else {
      renderBand();
      toast(S.running?'Maquette : skse64_loader.exe lancé avec « '+LO().n+' » (r.'+LO().rev+') — session enregistrée':'Maquette : session terminée · crash logs et FPS analysés → Santé');
    }
  }
  function toggleSide(){ app.classList.toggle('no-side'); }
  function render(){ renderSideTools(); renderSide(); renderSheet(); renderRight(); renderTP(); renderBand(); }
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==='k'){ e.preventDefault(); $('#cp-in').focus(); }
    if((e.ctrlKey||e.metaKey)&&k==='b'){ e.preventDefault(); toggleSide(); }
    if((e.ctrlKey||e.metaKey)&&k==='j'){ e.preventDefault(); S.tp=!S.tp; renderTP(); renderSheet(); }
    if((e.ctrlKey||e.metaKey)&&k==='l'){ e.preventDefault(); setRight(app.classList.contains('no-right')); }
    if((e.ctrlKey||e.metaKey)&&k==='s'){ e.preventDefault(); const sb=$('#save-btn'); if(sb&&!sb.disabled) sb.click(); }
    if(e.key==='Escape'){ closePops(); if(S.tp){ S.tp=false; renderTP(); renderSheet(); } }
    if(e.key==='F5'){ e.preventDefault(); play(); }
  });
  S.tabs=baseTabs(G());
  render();
})();
</script>
