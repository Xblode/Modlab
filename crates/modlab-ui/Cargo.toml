[package]
name = "modlab-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ModLab desktop shell: Tauri host for the React UI. A client of modlab-core, same as the CLI."

[lib]
name = "modlab_ui"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "modlab-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
modlab-core = { path = "../modlab-core" }
modlab-ai = { path = "../modlab-ai" }
modlab-game-skyrim = { path = "../modlab-game-skyrim" }
modlab-game-minecraft = { path = "../modlab-game-minecraft" }
serde = { workspace = true }
serde_json = { workspace = true }
# `unstable` is what gates multiwebview (`Window::add_child`): the embedded
# browser tab is a real second WebView2 control layered over the shell's own,
# not an iframe — Nexus sends `X-Frame-Options`, so an iframe cannot work.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
url = "2"

# Already resolved in Cargo.lock via wry. Pinned so this crate does not
# pull a newer webview2-com or windows.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "std",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
# Ships the llama.cpp inference backend (ADR 0004) — off by default because it
# triggers a full llama.cpp C++ build needing LLVM + CMake on the build machine.
local-llm = ["modlab-ai/local-llm"]

