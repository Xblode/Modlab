[package]
name = "modlab-game-skyrim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Skyrim Game Adapter — everything Bethesda-modding-specific lives here, never in modlab-core."

[dependencies]
modlab-core = { path = "../modlab-core" }
thiserror = "1"
roxmltree = "0.20"
# Header-only reader for .esp/.esm/.esl (flags + masters) — the same crate LOOT
# uses; see `plugins.rs` for why it is used instead of a hand-written parser.
esplugin = "6"
# Windows-1252 encoding of plugins.txt (already pulled in by esplugin).
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
