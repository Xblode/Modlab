[package]
name = "modlab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ModLab engine: the single source of truth. UI, CLI and MCP are all clients of this crate — see docs/01-architecture-decidee.md."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
blake3 = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
