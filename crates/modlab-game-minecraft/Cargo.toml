[package]
name = "modlab-game-minecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Minecraft Game Adapter — loaders, jars and providers live here, never in modlab-core."

[dependencies]
modlab-core = { path = "../modlab-core" }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
