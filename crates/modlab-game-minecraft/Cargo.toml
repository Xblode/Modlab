[package]
name = "modlab-game-minecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Minecraft Game Adapter — loaders, jars and providers live here, never in modlab-core."

[dependencies]
modlab-core = { path = "../modlab-core" }
zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
reqwest = { version = "0.13", features = ["blocking", "json", "form"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
md5 = "0.7"

[dev-dependencies]
tempfile = { workspace = true }
