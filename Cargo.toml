[workspace]
resolver = "2"
members = [
    "crates/modlab-core",
    "crates/modlab-cli",
    "crates/modlab-ai",
    "crates/modlab-game-skyrim",
    "crates/modlab-game-minecraft",
    "crates/modlab-ui",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"

[profile.dev]
# Fast rebuilds while the walking skeleton is still forming.
debug = 1

# Shared crates. Version requirements stay the ones already resolved in
# Cargo.lock — this block only stops each crate from repeating them.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
zip = "2"
encoding_rs = "0.8"
